
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant - Groq</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    height: 100vh;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    background: #11182b;
    border-right: 1px solid #283149;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    color: #8994ff;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 28px;
}

button {
    cursor: pointer;
}

.new-chat {
    padding: 13px;
    border: none;
    border-radius: 10px;
    color: white;
    background: #6875f5;
    font-size: 14px;
}

.sidebar h4 {
    color: #a6b1ca;
    font-size: 12px;
    margin: 25px 0 15px;
}

.history {
    color: #d4dcef;
    font-size: 14px;
}

.sidebar-bottom {
    margin-top: auto;
    color: #a6b1ca;
    font-size: 12px;
    line-height: 1.8;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    padding: 20px 25px;
    border-bottom: 1px solid #283149;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 20px;
}

.status {
    color: #75e6a3;
    font-size: 12px;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    max-width: 700px;
    margin: 100px auto 25px;
    text-align: center;
}

.bot-icon {
    margin: 0 auto 20px;
    width: 65px;
    height: 65px;
    border-radius: 20px;
    background: linear-gradient(135deg, #6875f5, #a855f7);
    display: grid;
    place-items: center;
    font-size: 30px;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.welcome p {
    color: #a6b1ca;
    line-height: 1.6;
}

.suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 28px;
}

.suggestion {
    text-align: left;
    color: white;
    background: #151e33;
    border: 1px solid #35415e;
    border-radius: 12px;
    padding: 17px;
    line-height: 1.5;
}

.suggestion:hover {
    border-color: #8994ff;
}

.message {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    max-width: 850px;
    margin: 0 auto 22px;
}

.avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 10px;
    background: #29375a;
    display: grid;
    place-items: center;
}

.message.user {
    flex-direction: row-reverse;
}

.message-content {
    background: #151e33;
    padding: 14px 16px;
    border-radius: 5px 14px 14px 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user .message-content {
    background: #29375a;
    border-radius: 14px 5px 14px 14px;
}

.composer-wrap {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 15px 20px 22px;
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: #151e33;
    border: 1px solid #35415e;
    padding: 9px;
    border-radius: 15px;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 140px;
    padding: 12px;
    color: white;
    background: transparent;
    border: none;
    outline: none;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

textarea::placeholder {
    color: #9ca8c4;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #6875f5;
    color: white;
    font-size: 21px;
}

.send:disabled {
    opacity: 0.5;
}

.footer {
    color: #8994b5;
    text-align: center;
    font-size: 11px;
    margin-top: 12px;
}

.error {
    color: #ffaaaa;
    font-size: 13px;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.settings {
    padding: 14px;
    margin-top: 20px;
    border: 1px solid #35415e;
    border-radius: 10px;
}

.settings label {
    display: block;
    font-size: 12px;
    color: #a6b1ca;
    margin-bottom: 8px;
}

.settings input,
.settings select {
    width: 100%;
    margin-bottom: 10px;
    padding: 9px;
    border-radius: 7px;
    border: 1px solid #35415e;
    background: #0b1020;
    color: white;
}

.settings button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: #29375a;
    color: white;
}

@media(max-width: 700px) {
    .sidebar {
        display: none;
    }

    .welcome {
        margin-top: 55px;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .chat-area {
        padding: 15px;
    }

    .composer-wrap {
        padding: 12px;
    }
}
</style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="logo">✦ AI Assistant</div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <h4>YOUR CHAT</h4>
        <div class="history">💬 Current conversation</div>

        <div class="settings">
            <label for="apiKey">Groq API Key (testing only)</label>
            <input id="apiKey" type="password"
                   placeholder="Enter your Groq API key"
                   autocomplete="off">

            <label for="model">AI Model</label>
            <select id="model">
                <option value="llama-3.3-70b-versatile">
                    Llama 3.3 70B
                </option>
                <option value="openai/gpt-oss-20b">
                    GPT OSS 20B
                </option>
            </select>

            <button onclick="clearKey()">Clear API Key</button>
        </div>

        <div class="sidebar-bottom">
            Powered by Groq API<br>
            AI Assistant Web App
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <h2>AI Chatbot</h2>
            <span class="status">● Assistant</span>
        </header>

        <section class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <div class="bot-icon">✦</div>
                <h1>How can I help you?</h1>
                <p>Ask a question and get an AI-generated answer.</p>

                <div class="suggestions">
                    <button class="suggestion"
                    onclick="ask('Explain Artificial Intelligence in simple words')">
                        💡 Explain Artificial Intelligence
                    </button>

                    <button class="suggestion"
                    onclick="ask('Teach me Python programming')">
                        💻 Teach me Python
                    </button>

                    <button class="suggestion"
                    onclick="ask('Give me a school project idea')">
                        🚀 School project ideas
                    </button>

                    <button class="suggestion"
                    onclick="ask('Explain Machine Learning with examples')">
                        📚 Learn Machine Learning
                    </button>
                </div>
            </div>
        </section>

        <div class="composer-wrap">
            <form class="composer" id="chatForm">
                <textarea id="userInput" rows="1"
                placeholder="Message your AI assistant..."
                required></textarea>

                <button class="send" id="sendBtn" type="submit">
                    ➤
                </button>
            </form>

            <div class="error" id="error"></div>

            <p class="footer">
                AI can make mistakes. Verify important information.
            </p>
        </div>
    </main>
</div>

<script>
const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const chatForm = document.getElementById("chatForm");
const sendBtn = document.getElementById("sendBtn");
const errorBox = document.getElementById("error");
const apiKeyInput = document.getElementById("apiKey");
const modelSelect = document.getElementById("model");

let messages = [];
let isLoading = false;

function addMessage(text, role) {
    const row = document.createElement("div");
    row.className = "message " + (role === "user" ? "user" : "bot");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "✦";

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;

    row.appendChild(avatar);
    row.appendChild(content);
    chatArea.appendChild(row);

    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
}

async function sendMessage(text) {
    text = text.trim();

    if (!text || isLoading) return;

    const apiKey = apiKeyInput.value.trim();

    if (!apiKey) {
        errorBox.textContent =
            "Pehle Groq API key enter karein. Public website par key publish na karein.";
        return;
    }

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    errorBox.textContent = "";
    addMessage(text, "user");

    messages.push({
        role: "user",
        content: text
    });

    userInput.value = "";
    userInput.style.height = "auto";
    isLoading = true;
    sendBtn.disabled = true;

    const typing = addMessage("AI is thinking...", "assistant");

    try {
        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + apiKey
                },
                body: JSON.stringify({
                    model: modelSelect.value,
                    messages: [
                        {
                            role: "system",
                            content: "You are a helpful, friendly AI assistant. Give clear, easy-to-understand answers."
                        },
                        ...messages
                    ],
                    temperature: 0.7,
                    max_tokens: 1024
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "HTTP error " + response.status
            );
        }

        const reply = data.choices?.[0]?.message?.content;

        if (!reply) {
            throw new Error("AI se reply nahi mila.");
        }

        typing.querySelector(".message-content").textContent = reply;

        messages.push({
            role: "assistant",
            content: reply
        });

    } catch (error) {
        typing.remove();
        errorBox.textContent = "Error: " + error.message;
        messages.pop();
    } finally {
        isLoading = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

chatForm.addEventListener("submit", function(event) {
    event.preventDefault();
    sendMessage(userInput.value);
});

userInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
    }
});

userInput.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
});

function ask(text) {
    sendMessage(text);
}

function newChat() {
    messages = [];
    chatArea.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="bot-icon">✦</div>
            <h1>How can I help you?</h1>
            <p>Start a new conversation with your AI assistant.</p>
        </div>
    `;
    errorBox.textContent = "";
    userInput.value = "";
    userInput.focus();
}

function clearKey() {
    apiKeyInput.value = "";
    errorBox.textContent = "API key field cleared.";
}
</script>

</body>
</html>
